[build]
  command = "npm install && node build-images.js"
  publish = "."

[build.environment]
  NODE_VERSION      = "20"
  # Netlify hard-kills the build at 18 min. Keep this BELOW that so the script's
  # own graceful stop (BUILD_TIMEOUT_MIN minus 3 min buffer = 12 min) fires first
  # and still writes .image-cache.json + image-manifest-cdn.json. If Netlify kills
  # the process instead, the cache is never saved and the next build starts cold.
  BUILD_TIMEOUT_MIN = "15"

# ── Functions ──────────────────────────────────────────────────
# The service account credential lives here as env vars, never in the pages.
# Routes are declared in each function file (Functions v2 `export const config`),
# so no redirect rules are needed.
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# ── Persist img/ between builds (fixes SIGBUS crash) ──────────
# Without this Netlify starts fresh each build, re-downloads all
# 3,462 images, runs out of memory. With it, subsequent builds
# skip unchanged images and complete in under a minute.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["img", ".image-cache.json"]

# ── Headers ────────────────────────────────────────────────────
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/image-manifest-cdn.json"
  [headers.values]
    Cache-Control = "public, max-age=900"

# API responses set their own Cache-Control per endpoint; these are the
# hardening headers that should apply to all of them.
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "no-referrer"

# publish = "." serves the whole repo root, so the function source, package.json
# and build-images.js are all fetchable over HTTP today. None of them contain
# secrets (the credential is an env var), but there is no reason to serve them.
# Diagnostics. tools/stock-parse-compare.html has to be same-origin with the
# API to run, so it lives in the published site — but there is no reason to
# serve it once a comparison is done. Comment this rule out to run it again.
[[redirects]]
  from   = "/tools/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/netlify/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/build-images.js"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/package.json"
  to     = "/"
  status = 404
  force  = true

# ── Branch: develop = staging ──────────────────────────────────
[context.develop]
  command = "npm install && node build-images.js"
  publish = "."
