[build]
  command = "npm install && node build-images.js && node build-stone-pages.js"
  publish = "."

[build.environment]
  NODE_VERSION      = "20"
  # Netlify hard-kills the build at 18 min. Keep this BELOW that so the script's
  # own graceful stop (BUILD_TIMEOUT_MIN minus 3 min buffer = 12 min) fires first
  # and still writes .image-cache.json + image-manifest-cdn.json. If Netlify kills
  # the process instead, the cache is never saved and the next build starts cold.
  BUILD_TIMEOUT_MIN = "15"

# ── Functions ──────────────────────────────────────────────────
# The service account credential lives here as env vars, never in the pages.
# Routes are declared in each function file (Functions v2 `export const config`),
# so no redirect rules are needed.
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# ── Persist img/ between builds (fixes SIGBUS crash) ──────────
# Without this Netlify starts fresh each build, re-downloads all
# 3,462 images, runs out of memory. With it, subsequent builds
# skip unchanged images and complete in under a minute.
[[plugins]]
  package = "netlify-plugin-cache"
  [plugins.inputs]
    paths = ["img", ".image-cache.json"]

# ── Headers ────────────────────────────────────────────────────
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/image-manifest-cdn.json"
  [headers.values]
    Cache-Control = "public, max-age=900"

# API responses set their own Cache-Control per endpoint; these are the
# hardening headers that should apply to all of them.
[[headers]]
  for = "/api/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "no-referrer"

# publish = "." serves the whole repo root, so the function source, package.json
# and build-images.js are all fetchable over HTTP today. None of them contain
# secrets (the credential is an env var), but there is no reason to serve them.

# ── NZ direct stock: per-customer trade links ─────────────────
# /nz/trendstone-4k2p and friends all serve the one page, which reads its slug
# from the last path segment and validates it server-side via /api/direct-stock.
# One page, one deploy, no per-customer builds.
#
# The splat MUST follow a path separator. "/nz-*" puts the wildcard mid-segment
# after a hyphen and matches nothing at all — it deploys without error and then
# 404s every request, which is a slow thing to diagnose. "/nz/*" is a real
# segment splat and works.
#
# /nz/ itself still serves index.html directly (a real file shadows a 200
# rewrite), which correctly shows the invalid-link screen: no slug, no customer.
[[redirects]]
  from   = "/nz/*"
  to     = "/nz/index.html"
  status = 200

# Deliberately NOT in robots.txt: that file is public, so a Disallow line would
# advertise the very address it is meant to keep unlisted. This header keeps it
# out of search results without publishing it.
[[headers]]
  for = "/nz/*"
  [headers.values]
    X-Robots-Tag   = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Diagnostics. tools/stock-parse-compare.html has to be same-origin with the API
# to run, so it lives in the published site — but there is no reason to serve it
# the rest of the time. Comment these four lines out when a comparison run is
# needed, then restore them.
[[redirects]]
  from   = "/tools/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/netlify/*"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/build-images.js"
  to     = "/"
  status = 404
  force  = true

[[redirects]]
  from   = "/package.json"
  to     = "/"
  status = 404
  force  = true

# ── Branch: develop = staging ──────────────────────────────────
[context.develop]
  command = "npm install && node build-images.js && node build-stone-pages.js"
  publish = "."
